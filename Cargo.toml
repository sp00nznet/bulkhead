[package]
name = "bulkhead"
version = "0.1.0"
edition = "2024"
description = "Disk imaging to VHDX, partition and data recovery, ext4/XFS/HFS+ reading, and drive erase with a certificate, for Windows."
repository = "https://github.com/sp00nznet/bulkhead"
license = "MIT"
readme = "README.md"
keywords = ["backup", "vhdx", "recovery", "partition", "secure-erase"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_Vhd", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Console", "Win32_Storage_IscsiDisc", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_Security_Cryptography"] }

# The binaries land on a Releases page; symbols there help nobody.
[profile.release]
strip = true
