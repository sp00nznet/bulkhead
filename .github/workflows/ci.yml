name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach binaries to a release

jobs:
  # A published advisory against anything in the tree is something to find out about from
  # CI rather than from a user. Separate from the build so a new advisory reports itself
  # without also failing the binaries.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # The conformance corpus: real ext2/ext4/XFS/HFS+ images made and filled by
  # each filesystem's own mkfs and the kernel, with a manifest of their hashes.
  # Built fresh every run, so no image is ever committed.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfsprogs hfsprogs
          sudo modprobe hfsplus || echo "no hfsplus module; HFS+ will report SKIP"
          sudo sh tools/corpus.sh corpus
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: corpus/

  windows:
    needs: corpus
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Without this every run recompiles the whole dependency tree.
      - uses: Swatinem/rust-cache@v2

      # --locked fails if Cargo.lock would change, so CI builds exactly what was committed
      # rather than silently picking up new dependency versions.
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

      # The conformance harness (REPO_RULES 9): the corpus read back and hashed,
      # mount-fs through WinFsp, and smoke.ps1's image/restore/move/rebuild/undelete/
      # carve stages on throwaway VHDX disks, which the runner's admin token allows.
      # Fails on any check in tools/conformance-baseline.txt that stops passing.
      # Real hardware (SANITIZE, a physical system disk) is still proven at a bench.
      - uses: actions/download-artifact@v4
        with:
          name: corpus
          path: corpus
      - run: choco install winfsp -y --no-progress
      - run: tools\conformance.ps1 -Corpus corpus
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: bulkhead-windows-x64
          path: |
            target/release/bulkhead.exe
            target/release/bulkhead-gui.exe

      # Only on a version tag: publish on the Releases page so people can download without
      # building, or trusting a binary from anywhere else. Both executables, because the
      # command line and the window are two different downloads for two different people.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            target/release/bulkhead.exe
            target/release/bulkhead-gui.exe
          generate_release_notes: true
